<!doctype html><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
const g=await new GLTFLoader().loadAsync('/_tmp/statue.glb'); g.scene.updateMatrixWorld(true);
const meshes=[];g.scene.traverse(o=>o.isMesh&&meshes.push(o));
const m=meshes[0], mat=m.material, src=m.geometry;
const n=src.attributes.position.count, P=new Float32Array(n*3), N=new Float32Array(n*3), U=new Float32Array(n*2);
const v=new THREE.Vector3(), nm=new THREE.Matrix3().getNormalMatrix(m.matrixWorld);
mat.map.updateMatrix(); const um=mat.map.matrix;
for(let i=0;i<n;i++){v.fromBufferAttribute(src.attributes.position,i).applyMatrix4(m.matrixWorld);P.set([v.x,v.y,v.z],i*3);
  v.fromBufferAttribute(src.attributes.normal,i).applyMatrix3(nm).normalize();N.set([v.x,v.y,v.z],i*3);
  const u=new THREE.Vector3(src.attributes.uv.getX(i),src.attributes.uv.getY(i),1).applyMatrix3(um);U.set([u.x,u.y],i*2);}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(P,3));geo.setAttribute('normal',new THREE.BufferAttribute(N,3));geo.setAttribute('uv',new THREE.BufferAttribute(U,2));
if(src.index)geo.setIndex(Array.from(src.index.array));
// fit to the old statue's footprint: height 1.24, base at y=-0.47, centred like the old one
geo.computeBoundingBox();const b=geo.boundingBox,s=1.24/(b.max.y-b.min.y);geo.translate(-(b.min.x+b.max.x)/2,-b.min.y,-(b.min.z+b.max.z)/2);geo.scale(s,s,s);geo.rotateY(Math.PI);geo.translate(.012,-.47,.12);
const out=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({name:'jar_mat'}));out.name='jar';
const glb=await new GLTFExporter().parseAsync(out,{binary:true});
const img=t=>{if(!t)return null;const c=document.createElement('canvas');c.width=t.image.width;c.height=t.image.height;c.getContext('2d').drawImage(t.image,0,0);return c.toDataURL('image/png');};
const b64=a=>{let s='';const u=new Uint8Array(a);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);};
window.RESULT={glb:b64(glb),map:img(mat.map),normal:img(mat.normalMap),info:{meshes:meshes.length,verts:n,idx:!!src.index,size:[b.max.x-b.min.x,b.max.y-b.min.y,b.max.z-b.min.z],mapSize:[mat.map.image.width,mat.map.image.height],uvT:[mat.map.offset.toArray(),mat.map.repeat.toArray(),mat.map.rotation]}};
</script>
